[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "desertcat-ui-automation"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
test = [
  "playwright>=1.52,<2",
  "pytest>=8.3,<9",
  "pytest-html>=4.1,<5",
  "pytest-playwright>=0.7,<1",
  "pytest-rerunfailures>=15,<17",
  "pytest-timeout>=2.3,<3",
  "pytest-xdist>=3.6,<4",
]
dev = ["mypy>=1.15,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --timeout=90"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "ui: browser UI suite",
  "public: public pages",
  "community: community pages",
  "social: social pages",
  "admin: account and administration pages",
  "access_control: login and permission guard contracts",
  "p0: critical path",
  "p1: normal priority",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["desertcat_ui"]
